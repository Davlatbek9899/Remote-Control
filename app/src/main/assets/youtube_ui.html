<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YouTube</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #ffffff; color: #0f0f0f;
        font-family: -apple-system, Roboto, Arial, sans-serif;
        padding-bottom: 60px;
    }
    header {
        position: sticky; top: 0; z-index: 30;
        background: #ffffff; height: 56px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px; border-bottom: 1px solid #f1f1f1;
    }
    .logo { display: flex; align-items: center; gap: 6px; }
    .logo span { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .icons { display: flex; align-items: center; gap: 18px; }
    .icon-btn { font-size: 22px; background: none; border: none; cursor: pointer; position: relative; }
    .avatar {
        width: 28px; height: 28px; border-radius: 50%;
        background: #6a1b9a; color: #fff; display: flex;
        align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    }
    nav.chips {
        position: sticky; top: 56px; z-index: 20; background: #ffffff;
        display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto;
        border-bottom: 1px solid #f1f1f1; white-space: nowrap;
    }
    nav.chips::-webkit-scrollbar { display: none; }
    .chip {
        padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
        background: #f2f2f2; color: #0f0f0f; border: none; cursor: pointer; flex-shrink: 0;
    }
    .chip.active { background: #0f0f0f; color: #fff; }
    .search-bar {
        display: flex; align-items: center; gap: 8px; margin: 10px 12px;
        background: #f2f2f2; border-radius: 20px; padding: 8px 14px;
    }
    .search-bar input {
        border: none; background: none; outline: none; font-size: 14px; flex: 1; color: #0f0f0f;
    }
    main { }
    article {
        padding: 4px 0 14px 0; border-bottom: 1px solid #f1f1f1;
    }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #e5e5e5; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration {
        position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.8);
        color: #fff; font-size: 11px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
    }
    .video-info { display: flex; gap: 10px; padding: 10px 12px 0 12px; }
    .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: #d9d9d9; flex-shrink: 0; overflow: hidden; }
    .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .video-text { flex: 1; min-width: 0; }
    .video-title {
        font-size: 14px; font-weight: 600; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .video-meta { font-size: 12px; color: #606060; margin-top: 3px; }
    .more-btn { background: none; border: none; font-size: 18px; color: #606060; align-self: flex-start; cursor: pointer; }

    footer {
        position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #ffffff;
        border-top: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-around; z-index: 40;
    }
    .nav-btn {
        background: none; border: none; display: flex; flex-direction: column; align-items: center;
        gap: 2px; font-size: 10px; color: #606060; flex: 1; padding: 4px 0; cursor: pointer;
    }
    .nav-btn .ic { font-size: 20px; }
    .nav-btn.active { color: #0f0f0f; font-weight: 600; }

    #loading { text-align: center; padding: 30px; color: #999; font-size: 13px; }
    #connectBox { text-align: center; padding: 60px 24px; }
    #connectBox p { color: #606060; font-size: 14px; margin-bottom: 16px; }
    #connectBtn {
        background: #ff0000; color: #fff; border: none; border-radius: 24px;
        padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* Pleyer ko'rinishi */
    #playerView { display: none; }
    #playerView.show { display: block; }
    #feedView.hide { display: none; }
    #ytPlayerWrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    .player-info { padding: 12px; }
    .player-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .player-channel { font-size: 12px; color: #606060; margin-top: 6px; }
    .back-row {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border-bottom: 1px solid #f1f1f1; font-size: 14px; font-weight: 600; cursor: pointer;
    }
</style>
</head>
<body>

<div id="feedView">
    <header>
        <div class="logo">
            <svg width="26" height="18" viewBox="0 0 28 20"><path fill="#FF0000" d="M27.4 3.1c-.3-1.2-1.3-2.1-2.5-2.4C22.7 0 14 0 14 0S5.3 0 3.1.7C1.9 1 1 1.9.6 3.1 0 5.3 0 10 0 10s0 4.7.6 6.9c.3 1.2 1.3 2.1 2.5 2.4 2.2.7 10.9.7 10.9.7s8.7 0 10.9-.7c1.2-.3 2.1-1.2 2.5-2.4.6-2.2.6-6.9.6-6.9s0-4.7-.6-6.9zM11.2 14.3V5.7l7.5 4.3-7.5 4.3z"/></svg>
            <span>YouTube</span>
        </div>
        <div class="icons">
            <button class="icon-btn" onclick="AndroidBridge.onHome()">🔄</button>
            <div class="avatar">R</div>
        </div>
    </header>

    <div class="search-bar">
        <span>🔍</span>
        <input id="searchInput" placeholder="Qidirish..." onkeydown="if(event.key==='Enter'){doSearch()}">
    </div>

    <nav class="chips" id="chips">
        <button class="chip active" onclick="setCategory(this,'')">Hammasi</button>
        <button class="chip" onclick="setCategory(this,'music')">Musiqa</button>
        <button class="chip" onclick="setCategory(this,'mix')">Mix</button>
        <button class="chip" onclick="setCategory(this,'gaming')">O'yinlar</button>
        <button class="chip" onclick="setCategory(this,'jonli efir')">Jonli efir</button>
    </nav>

    <main id="feed">
        <div id="loading">Yuklanmoqda...</div>
    </main>

    <footer>
        <button class="nav-btn active"><span class="ic">🏠</span>Bosh sahifa</button>
        <button class="nav-btn"><span class="ic">⏯️</span>Shorts</button>
        <button class="nav-btn"><span class="ic">➕</span></button>
        <button class="nav-btn"><span class="ic">📺</span>Obunalar</button>
        <button class="nav-btn"><span class="ic">👤</span>Siz</button>
    </footer>
</div>

<div id="playerView">
    <div class="back-row" onclick="closePlayer()">← Orqaga</div>
    <div id="ytPlayerWrap"><div id="ytPlayerEl"></div></div>
    <div class="player-info">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-channel" id="playerChannel"></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    var ytPlayer = null;
    var pendingPlay = null;

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('ytPlayerEl', {
            height: '100%', width: '100%',
            playerVars: { 'autoplay': 1, 'playsinline': 1, 'controls': 1, 'origin': 'https://remotecontrol.13-60-189-220.sslip.io' },
            events: {
                'onReady': function(e) {
                    if (pendingPlay) {
                        e.target.loadVideoById({videoId: pendingPlay.videoId, startSeconds: pendingPlay.start});
                        pendingPlay = null;
                    }
                }
            }
        });
    }

    function showConnectButton() {
        document.getElementById('feed').innerHTML =
            '<div id="connectBox"><p>YouTube\'ni ishga tushirish uchun Google hisobingizni bog\'lang</p>' +
            '<button id="connectBtn" onclick="AndroidBridge.onConnectAccount()">Google hisobni bog\'lash</button></div>';
    }

    function renderVideos(jsonStr) {
        var items = JSON.parse(jsonStr);
        document.getElementById('loading')?.remove();
        var feed = document.getElementById('feed');
        feed.innerHTML = '';
        if (items.length === 0) {
            feed.innerHTML = '<div id="loading">Hech narsa topilmadi</div>';
            return;
        }
        items.forEach(function(v) {
            var art = document.createElement('article');
            art.onclick = function() { openVideo(v.id, v.title, v.channel); };
            art.innerHTML =
                '<div class="thumb-wrap"><img src="' + v.thumb + '"><span class="duration">' + v.duration + '</span></div>' +
                '<div class="video-info">' +
                '  <div class="channel-avatar"></div>' +
                '  <div class="video-text">' +
                '    <div class="video-title">' + escapeHtml(v.title) + '</div>' +
                '    <div class="video-meta">' + escapeHtml(v.channel) + ' • ' + v.views + ' ta ko\'rish • ' + v.ago + '</div>' +
                '  </div>' +
                '  <button class="more-btn">⋮</button>' +
                '</div>';
            feed.appendChild(art);
        });
    }

    function escapeHtml(s) {
        var d = document.createElement('div'); d.innerText = s; return d.innerHTML;
    }

    function setCategory(el, cat) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('feed').innerHTML = '<div id="loading">Yuklanmoqda...</div>';
        if (cat === '') {
            AndroidBridge.onHome();
        } else {
            AndroidBridge.onSearch(cat);
        }
    }

    function doSearch() {
        var q = document.getElementById('searchInput').value.trim();
        if (!q) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        document.getElementById('feed').innerHTML = '<div id="loading">Yuklanmoqda...</div>';
        AndroidBridge.onSearch(q);
    }

    function openVideo(videoId, title, channel, startSeconds) {
        document.getElementById('feedView').classList.add('hide');
        document.getElementById('playerView').classList.add('show');
        document.getElementById('playerTitle').innerText = title;
        document.getElementById('playerChannel').innerText = channel;
        var start = startSeconds || 0;
        if (ytPlayer && ytPlayer.loadVideoById) {
            ytPlayer.loadVideoById({videoId: videoId, startSeconds: start});
        } else {
            pendingPlay = {videoId: videoId, start: start};
        }
    }

    function closePlayer() {
        document.getElementById('playerView').classList.remove('show');
        document.getElementById('feedView').classList.remove('hide');
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    }
</script>
</body>
</html>
