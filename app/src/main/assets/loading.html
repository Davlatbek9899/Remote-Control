<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; height: 100vh; background: transparent; }
.dots-container { display: flex; align-items: center; justify-content: center; }
.dot {
  height: 10px;
  width: 10px;
  margin-right: 6px;
  border-radius: 50%;
  background-color: #FFFFFF;
  animation: pulse 1.5s infinite ease-in-out;
}
.dot:last-child { margin-right: 0; }
.dot:nth-child(1) { animation-delay: -0.3s; }
.dot:nth-child(2) { animation-delay: -0.1s; }
.dot:nth-child(3) { animation-delay: 0.1s; }
.dot:nth-child(4) { animation-delay: 0.3s; }
.dot:nth-child(5) { animation-delay: 0.5s; }
@keyframes pulse {
  0% { transform: scale(0.8); background-color: rgba(255,255,255,0.5); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
  50% { transform: scale(1.2); background-color: #FFFFFF; box-shadow: 0 0 0 6px rgba(255,255,255,0); }
  100% { transform: scale(0.8); background-color: rgba(255,255,255,0.5); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
}
</style>
</head>
<body>
<section class="dots-container">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</section>
</body>
</html>
