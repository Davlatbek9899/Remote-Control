<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<style>
*{margin:0;padding:0}
html,body,#map{width:100%;height:100%;overflow:hidden}
#layerBtn{position:absolute;top:10px;right:10px;z-index:1000;background:white;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:#333;box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:pointer}
#layerPanel{position:absolute;top:46px;right:10px;z-index:1000;background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.2);overflow:hidden;display:none;min-width:120px}
.layerItem{display:block;width:100%;padding:9px 14px;border:none;border-bottom:1px solid #f0f0f0;background:white;font-size:12px;font-weight:500;color:#444;cursor:pointer;text-align:left}
.layerItem:last-child{border-bottom:none}
.layerItem.active{background:#E8F0FE;color:#1967D2;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<button id="layerBtn" onclick="togglePanel()">&#128506; Standart</button>
<div id="layerPanel">
  <button class="layerItem active" onclick="setLayer('osm','Standart','&#128506;',this)">&#128506; Standart</button>
  <button class="layerItem" onclick="setLayer('sat','Sputnik','&#128752;',this)">&#128752; Sputnik</button>
  <button class="layerItem" onclick="setLayer('hybrid','Gibrid','&#127758;',this)">&#127758; Gibrid</button>
</div>
<script>
var map, marker, currentLayer;
var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,subdomains:["a","b","c"]});
var sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19});
var satBase = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19});
var osmLabels = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,subdomains:["a","b","c"],opacity:0.6});
var hybrid = L.layerGroup([satBase, osmLabels]);
var layers = {osm:osm, sat:sat, hybrid:hybrid};
currentLayer = osm;
map = L.map("map",{center:[41.2995,69.2401],zoom:16,layers:[osm],zoomControl:false,attributionControl:false});
var svgIcon = "<div style='width:30px;height:40px'><svg viewBox='0 0 24 36' xmlns='http://www.w3.org/2000/svg'><path d='M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z' fill='#E53935'/><circle cx='12' cy='12' r='5' fill='#B71C1C'/></svg></div>";
var icon = L.divIcon({html:svgIcon,iconAnchor:[15,40],className:""});
marker = L.marker([41.2995,69.2401],{icon:icon}).addTo(map);
function togglePanel(){
  var p=document.getElementById("layerPanel");
  p.style.display=p.style.display==="block"?"none":"block";
}
function setLayer(name, label, emoji, btn){
  map.removeLayer(currentLayer);
  currentLayer=layers[name];
  map.addLayer(currentLayer);
  document.querySelectorAll(".layerItem").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  document.getElementById("layerBtn").innerHTML=emoji+" "+label;
  document.getElementById("layerPanel").style.display="none";
}
map.on("click",function(){document.getElementById("layerPanel").style.display="none";});
function setLocation(lat,lng){map.setView([lat,lng],16);marker.setLatLng([lat,lng]);}
</script>
</body>
</html>
